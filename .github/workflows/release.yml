---
name: Release

on:
  workflow_run:
    workflows:
      - Build
    types:
      - completed
    branches:
      - main

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      # ==============================================================
      # Checkout main
      # ==============================================================
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # ==============================================================
      # Get next version
      # ==============================================================
      - name: Get next version
        id: version
        shell: bash
        run: |
          git fetch --tags

          tags=$(git tag --list "v1.0.*")

          if [ -z "$tags" ]; then
            patch=1
          else
            patch=$(echo "$tags" |
              sed 's/^v1\.0\.//' |
              sort -n |
              tail -n 1)

            patch=$((patch + 1))
          fi

          version="1.0.$patch"
          tag="v$version"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # ==============================================================
      # Download firmware artifact from Build workflow
      # ==============================================================
      - name: Download firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      # ==============================================================
      # Show firmware files
      # ==============================================================
      - name: Show firmware files
        shell: bash
        run: |
          echo "Firmware files:"
          find firmware -type f -print

      # ==============================================================
      # Create firmware ZIP
      # ==============================================================
      - name: Create firmware ZIP
        shell: bash
        run: |
          cd firmware
          zip -r "../firmware.zip" .
          cd ..

          echo "Created firmware.zip:"
          ls -lh firmware.zip

      # ==============================================================
      # Create GitHub Release
      # ==============================================================
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: main
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: firmware.zip
