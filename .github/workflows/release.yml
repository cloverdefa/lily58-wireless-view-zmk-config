name: Release

on:
  workflow_run:
    workflows:
      - Build
    types:
      - completed
    branches:
      - main

  workflow_dispatch:
    inputs:
      release_type:
        description: Release version type
        required: true
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: auto

permissions:
  contents: write
  actions: read

jobs:
  release:
    # ==============================================================
    # 限制條件：
    # 1. 手動觸發 (workflow_dispatch) 時一律允許。
    # 2. 自動觸發時：Build Workflow 必須成功，且觸發該 Build 的 PR
    #    來源分支 (head.ref) 必須為 'test'。
    # ==============================================================
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.pull_requests[0].head.ref == 'test'
      )

    runs-on: ubuntu-latest

    steps:
      # ==============================================================
      # Checkout main
      # ==============================================================

      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      # ==============================================================
      # Get next version
      # ==============================================================

      - name: Get next version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags --force

          # ----------------------------------------------------------
          # Find latest semantic version tag
          # ----------------------------------------------------------

          latest_tag="$(
            git tag --list 'v*.*.*' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
            sort -V |
            tail -n 1 || true
          )"

          # ----------------------------------------------------------
          # First release
          # ----------------------------------------------------------

          if [ -z "$latest_tag" ]; then
            major=1
            minor=0
            patch=1

            echo "No existing release tag found."

          else
            version="${latest_tag#v}"

            IFS='.' read -r major minor patch <<< "$version"

            echo "Latest tag: $latest_tag"

            # --------------------------------------------------------
            # Determine release type
            # --------------------------------------------------------

            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              release_type="${{ inputs.release_type }}"

              echo "Manual release type: $release_type"

            else
              release_type="none"

              # ------------------------------------------------------
              # Find commits since latest release
              # ------------------------------------------------------

              echo "Analyzing commits since $latest_tag..."

              while IFS= read -r commit; do
                echo "Commit:"
                echo "$commit"

                # MAJOR
                if printf '%s\n' "$commit" |
                  grep -Eq '^[a-zA-Z0-9_-]+(\([^)]*\))?!:' ||
                  printf '%s\n' "$commit" |
                  grep -Eq 'BREAKING CHANGE:'; then

                  release_type="major"
                  continue
                fi

                # MINOR
                if printf '%s\n' "$commit" |
                  grep -Eq '^feat(\([^)]*\))?:'; then

                  if [ "$release_type" != "major" ]; then
                    release_type="minor"
                  fi

                  continue
                fi

                # PATCH
                if printf '%s\n' "$commit" |
                  grep -Eq '^fix(\([^)]*\))?:'; then

                  if [ "$release_type" = "none" ]; then
                    release_type="patch"
                  fi

                  continue
                fi

              done < <(
                git log "$latest_tag..HEAD" \
                  --pretty=format:'%s%n%b%n---'
              )

              echo "Automatically detected release type: $release_type"
            fi

            # --------------------------------------------------------
            # No release required
            # --------------------------------------------------------

            if [ "$release_type" = "none" ]; then
              echo "No release required."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # --------------------------------------------------------
            # Calculate next version
            # --------------------------------------------------------

            case "$release_type" in
              patch)
                patch=$((patch + 1))
                ;;

              minor)
                minor=$((minor + 1))
                patch=0
                ;;

              major)
                major=$((major + 1))
                minor=0
                patch=0
                ;;

              auto)
                echo "::error::'auto' is only valid for automatic release."
                exit 1
                ;;

              *)
                echo "::error::Invalid release type: $release_type"
                exit 1
                ;;
            esac
          fi

          version="${major}.${minor}.${patch}"
          tag="v${version}"

          # ----------------------------------------------------------
          # Prevent duplicate tag
          # ----------------------------------------------------------

          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "::error::Tag $tag already exists."
            exit 1
          fi

          echo "Release type: ${release_type:-initial}"
          echo "Next version: $version"
          echo "Next tag: $tag"

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "release_type=${release_type:-initial}" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # ==============================================================
      # Download firmware artifact from Build workflow
      # ==============================================================

      - name: Download firmware
        if: steps.version.outputs.should_release == 'true'
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      # ==============================================================
      # Show firmware files
      # ==============================================================

      - name: Show firmware files
        if: steps.version.outputs.should_release == 'true'
        shell: bash
        run: |
          echo "Firmware files:"
          find firmware -type f -print

      # ==============================================================
      # Create firmware ZIP
      # ==============================================================

      - name: Create firmware ZIP
        if: steps.version.outputs.should_release == 'true'
        shell: bash
        run: |
          cd firmware
          zip -r "../firmware.zip" .
          cd ..

          echo "Created firmware.zip:"
          ls -lh firmware.zip

      # ==============================================================
      # Create GitHub Release
      # ==============================================================

      - name: Create Release
        if: steps.version.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: main
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: firmware.zip
