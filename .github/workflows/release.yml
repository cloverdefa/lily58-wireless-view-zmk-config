name: Release

on:
  workflow_run:
    workflows:
      - Build
    types:
      - completed
    branches:
      - main

  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

jobs:
  release:
    # ==============================================================
    # 僅允許：
    # 1. 手動觸發 (workflow_dispatch)
    # 2. PR 被成功合併，且來源分支為 'test'、目標分支為 'main'
    # ==============================================================
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.merged == true &&
        github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.ref == 'test'
      )

    runs-on: ubuntu-latest

    steps:
      # ==============================================================
      # Checkout main
      # ==============================================================

      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      # ==============================================================
      # Fetch tags
      # ==============================================================

      - name: Fetch tags
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

      # ==============================================================
      # Determine next version
      #
      # 規則（精簡版，無手動選擇，優先序 major > minor > patch）：
      #   - 沒有任何 tag                -> 第一版 v0.1.0
      #   - commit 含 "MAJOR CHANGE:"   -> major + 1, minor/patch 歸零
      #   - commit 含 feat: / !: /
      #     BREAKING CHANGE:            -> minor + 1, patch 歸零
      #   - 其他情況（含 fix、chore 等）-> patch + 1
      #
      # 注意：
      #   - "MAJOR CHANGE:" 是刻意獨立於 Conventional Commits 規範的
      #     "BREAKING CHANGE:" 之外的自訂標記，因為這裡 "!:" 與
      #     "BREAKING CHANGE:" 已經被指定對應到 minor，需要另一個
      #     不衝突的標記來觸發 major。
      #   - 每次符合觸發條件都會發版（即使只是 chore/docs），
      #     這是刻意簡化後的行為。
      # ==============================================================

      - name: Determine next version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          LATEST_VERSION="$(
            git tag --list 'v*.*.*' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
            sort -V |
            tail -n 1 || true
          )"

          if [[ -z "$LATEST_VERSION" ]]; then
            echo "No existing release tag found."
            NEXT_VERSION="v0.1.0"

          else
            echo "Latest tag: $LATEST_VERSION"

            VERSION_WITHOUT_V="${LATEST_VERSION#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_WITHOUT_V"

            # ----------------------------------------------------------
            # 讀取完整 commit 訊息（含 body/footer），而非只有標題行，
            # 並用嚴格的格式比對，避免 "feature: ..." 這類非規範訊息
            # 被誤判成 "feat:"
            # ----------------------------------------------------------

            BUMP="patch"

            while IFS= read -r line; do
              if printf '%s\n' "$line" | grep -Eq '^MAJOR CHANGE:'; then
                BUMP="major"
                break
              fi

              if printf '%s\n' "$line" | grep -Eq '^[a-zA-Z0-9_-]+(\([^)]*\))?!:' \
                || printf '%s\n' "$line" | grep -Eq '^BREAKING CHANGE:' \
                || printf '%s\n' "$line" | grep -Eq '^feat(\([^)]*\))?:'; then
                BUMP="minor"
              fi
            done < <(git log "${LATEST_VERSION}..HEAD" --pretty=format:'%s%n%b%n---')

            case "$BUMP" in
              major)
                echo "Found MAJOR CHANGE commit -> bumping major."
                NEXT_VERSION="v$((MAJOR + 1)).0.0"
                ;;
              minor)
                echo "Found feat / breaking change commit -> bumping minor."
                NEXT_VERSION="v${MAJOR}.$((MINOR + 1)).0"
                ;;
              *)
                echo "No feat/major commit found -> bumping patch."
                NEXT_VERSION="v${MAJOR}.${MINOR}.$((PATCH + 1))"
                ;;
            esac
          fi

          # ----------------------------------------------------------
          # 防止重複 tag
          # ----------------------------------------------------------

          if git rev-parse "$NEXT_VERSION" >/dev/null 2>&1; then
            echo "::error::Tag $NEXT_VERSION already exists."
            exit 1
          fi

          echo "Next version: $NEXT_VERSION"
          echo "VERSION=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"

      # ==============================================================
      # Download firmware artifact from Build workflow
      # ==============================================================

      - name: Download firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      # ==============================================================
      # Show firmware files
      # ==============================================================

      - name: Show firmware files
        shell: bash
        run: |
          echo "Firmware files:"
          find firmware -type f -print

      # ==============================================================
      # Create firmware ZIP
      # ==============================================================

      - name: Create firmware ZIP
        shell: bash
        run: |
          cd firmware
          zip -r "../firmware.zip" .
          cd ..

          echo "Created firmware.zip:"
          ls -lh firmware.zip

      # ==============================================================
      # Create Release and Push Tag
      # ==============================================================

      - name: Create Release and Push Tag
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.VERSION }}
          name: ${{ steps.version.outputs.VERSION }}
          commit: main
          artifacts: firmware.zip
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}


