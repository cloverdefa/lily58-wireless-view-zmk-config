---
name: Release

on:
  # ================================================================
  # Automatic release
  # ================================================================
  workflow_run:
    workflows:
      - Build
    types:
      - completed
    branches:
      - main

  # ================================================================
  # Manual release
  # ================================================================
  workflow_dispatch:
    inputs:
      release_type:
        description: Release version type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

      run_id:
        description: Build workflow run ID for firmware artifact
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  release:
    # ==============================================================
    # workflow_run:
    #   Only release when Build succeeds.
    #
    # workflow_dispatch:
    #   Always allow manual release.
    # ==============================================================

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      # ==============================================================
      # Checkout main
      # ==============================================================

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      # ==============================================================
      # Get next version
      # ==============================================================

      - name: Get next version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags --force

          # ----------------------------------------------------------
          # Find latest semantic version tag
          #
          # Examples:
          #   v0.1.0
          #   v0.1.1
          #   v1.0.0
          #   v1.1.5
          # ----------------------------------------------------------

          latest_tag="$(
            git tag --list 'v*' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
            sort -V |
            tail -n 1 || true
          )"

          # ----------------------------------------------------------
          # Determine release type
          # ----------------------------------------------------------

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            release_type="${{ inputs.release_type }}"
          else
            release_type="patch"
          fi

          echo "Latest tag: ${latest_tag:-none}"
          echo "Release type: $release_type"

          # ----------------------------------------------------------
          # First release
          # ----------------------------------------------------------

          if [ -z "$latest_tag" ]; then
            case "$release_type" in
              patch)
                major=0
                minor=1
                patch=1
                ;;

              minor)
                major=0
                minor=2
                patch=0
                ;;

              major)
                major=1
                minor=0
                patch=0
                ;;

              *)
                echo "::error::Invalid release type: $release_type"
                exit 1
                ;;
            esac

          else
            version="${latest_tag#v}"

            IFS='.' read -r major minor patch <<< "$version"

            # --------------------------------------------------------
            # Calculate next version
            # --------------------------------------------------------

            case "$release_type" in
              patch)
                patch=$((patch + 1))
                ;;

              minor)
                minor=$((minor + 1))
                patch=0
                ;;

              major)
                major=$((major + 1))
                minor=0
                patch=0
                ;;

              *)
                echo "::error::Invalid release type: $release_type"
                exit 1
                ;;
            esac
          fi

          version="${major}.${minor}.${patch}"
          tag="v${version}"

          # ----------------------------------------------------------
          # Prevent duplicate tag
          # ----------------------------------------------------------

          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "::error::Tag $tag already exists."
            exit 1
          fi

          echo "Next version: $version"
          echo "Next tag: $tag"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # ==============================================================
      # Determine Build workflow run ID
      # ==============================================================

      - name: Get Build run ID
        id: build
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            run_id="${{ inputs.run_id }}"
          else
            run_id="${{ github.event.workflow_run.id }}"
          fi

          echo "Using Build run ID: $run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      # ==============================================================
      # Download firmware artifact from Build workflow
      # ==============================================================

      - name: Download firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware
          github-token: ${{ secrets.RELEASE_TOKEN }}
          run-id: ${{ steps.build.outputs.run_id }}

      # ==============================================================
      # Show firmware files
      # ==============================================================

      - name: Show firmware files
        shell: bash
        run: |
          echo "Firmware files:"
          find firmware -type f -print

      # ==============================================================
      # Create firmware ZIP
      # ==============================================================

      - name: Create firmware ZIP
        shell: bash
        run: |
          cd firmware
          zip -r "../firmware.zip" .
          cd ..

          echo "Created firmware.zip:"
          ls -lh firmware.zip

      # ==============================================================
      # Create GitHub Release
      # ==============================================================

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: main
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: firmware.zip
